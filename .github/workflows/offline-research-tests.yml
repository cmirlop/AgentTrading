name: Offline research tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    # Research-only branches use focused jobs and do not trigger historical backtests.
    if: >-
      github.ref != 'refs/heads/codex/phase2-2-2i-gap-classification' &&
      github.event.pull_request.head.ref != 'codex/phase2-2-2i-gap-classification' &&
      github.ref != 'refs/heads/codex/news-02-relative-currency-impact' &&
      github.event.pull_request.head.ref != 'codex/news-02-relative-currency-impact'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install offline-test dependencies
        run: python -m pip install "pandas>=2.2,<3" "numpy>=1.26,<3" "pydantic>=2.6,<3"
      - name: Phase 2.2.2a–e unit tests
        run: |
          python -m unittest discover -s tests -p "test_phase2_2_2*.py"
          python -m unittest tests.test_macro_sources tests.test_verified_dataset_backtests
      - name: NEWS-LOCAL-01 offline adapter tests
        run: python -m unittest tests.test_news_local -q
      - name: Public 2023+ provenance and audit tests
        run: |
          python -m unittest tests.test_public_2023_history_audit
          python scripts/audit_public_2023_history.py
      - name: Phase 2.2.2f–g synchronization tests (simulated MT5 only)
        run: |
          python -m unittest tests.test_mt5_candle_sync
          python -m unittest tests.test_mt5_history_2023_sync
      - name: Historical backtest and MT5 safety tests
        run: |
          python -m unittest discover -s tests -p "test_phase1_backtest.py"
          python -m unittest tests.test_mt5_real_readonly tests.test_phase1_mt5_safety
      - name: Compile source and validators
        run: python -m compileall -q config src scripts
      - name: Look-ahead validation
        run: python test_no_lookahead.py
      - name: Privacy and private-path checks
        run: python scripts/check_phase2_2_2e_privacy.py
      - name: No MT5 module dependency in new offline adapters
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          paths = [
              "src/macro_sources",
              "src/verified_research_dataset.py",
              "src/public_2023_history_audit.py",
              "scripts/audit_public_2023_history.py",
              "scripts/validate_phase2_2_2h.py",
              "tests/test_macro_sources.py",
              "tests/test_verified_dataset_backtests.py",
              "tests/test_public_2023_history_audit.py",
          ]
          pattern = re.compile(r"^\s*(?:import\s+MetaTrader5\b|from\s+MetaTrader5\b)")
          matches = []
          for entry in paths:
              path = Path(entry)
              files = path.rglob("*.py") if path.is_dir() else [path]
              for file in files:
                  for number, line in enumerate(file.read_text(encoding="utf-8").splitlines(), 1):
                      if pattern.search(line):
                          matches.append(f"{file}:{number}:{line.strip()}")
          if matches:
              print("\n".join(matches))
              sys.exit(1)
          print("No direct MetaTrader5 imports in offline adapters or tests.")
          PY
      - name: Diff whitespace check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base"
          else
            git fetch --no-tags --depth=1 origin main
            base="$(git rev-parse FETCH_HEAD)"
          fi
          git diff --check "$base..HEAD"

  phase2-2-2i-gap-classification:
    if: github.ref == 'refs/heads/codex/phase2-2-2i-gap-classification' || github.event.pull_request.head.ref == 'codex/phase2-2-2i-gap-classification'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install offline research-test dependencies
        run: python -m pip install "pandas>=2.2,<3" "numpy>=1.26,<3" "pydantic>=2.6,<3"
      - name: Deterministic interval inventory, focused regressions, and read-only integrity checks
        run: python scripts/validate_phase2_2_2i.py
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD

  news-local-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install NEWS-LOCAL test dependency
        run: python -m pip install "pydantic>=2.6,<3" "python-dotenv>=1,<2"
      - name: NEWS-LOCAL-01, NEWS-02, and NEWS-04 offline tests
        run: python -m unittest tests.test_news_local tests.test_news_02 tests.test_news_research tests.test_macro_sources tests.test_news_04_macro_contract -q
      - name: Compile NEWS-LOCAL sources and focused tests
        run: python -m compileall -q src/news_local src/macro_sources/core.py scripts/run_news_local_ollama.py scripts/run_news_research.py tests/test_news_local.py tests/test_news_02.py tests/test_news_research.py tests/test_macro_sources.py tests/test_news_04_macro_contract.py
      - name: Offline and mock CLI pair matrix
        run: |
          for symbol in EURUSD USDCAD AUDUSD; do
            python scripts/run_news_local_ollama.py --mode offline --fixture usd_only --symbol "$symbol" >/dev/null
            python scripts/run_news_local_ollama.py --mode mock-ollama --fixture usd_only --symbol "$symbol" >/dev/null
          done
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
